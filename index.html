<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scope Pong</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 10%27%3E%3Ccircle cx=%275%27 cy=%275%27 r=%274%27 fill=%27%2300f0ff%27/%3E%3C/svg%3E">
<style>
:root{--bg:#000;--p1:#00f0ff;--p2:#ff2bd6;--gold:#ffd54a;--txt:#8a8fa8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--txt);box-sizing:border-box;padding:10px 14px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;font-family:ui-monospace,Menlo,Consolas,monospace}
[hidden]{display:none!important}
#stage{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pad{position:relative;height:54px;border:1px solid var(--c);border-radius:27px;touch-action:none;cursor:ew-resize;box-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 20%,transparent)}
.pad span{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--c);opacity:.55}
.puck{position:absolute;top:50%;left:50%;will-change:transform;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 12px var(--c),inset 0 0 8px color-mix(in srgb,var(--c) 30%,transparent)}
#menu{position:fixed;inset:0;z-index:10;background:#000;display:grid;place-content:center;justify-items:center;gap:22px;padding:24px;text-align:center;overflow:auto}
#menu h1{margin:0;font-size:34px;font-weight:700;color:#fff;text-shadow:0 0 10px #00f0ff,0 0 26px #ff2bd6}
.view{display:grid;gap:14px;justify-items:center}
.big{min-width:240px;padding:16px 22px;font:inherit;font-size:18px;color:var(--c,#fff);background:transparent;border:2px solid var(--c,#fff);border-radius:16px;cursor:pointer;box-shadow:0 0 18px color-mix(in srgb,var(--c,#fff) 30%,transparent)}
.big:active{background:color-mix(in srgb,var(--c,#fff) 18%,transparent)}
.big:disabled{opacity:.4}
.link{background:none;border:0;color:#8a8fa8;font:inherit;padding:8px;cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:330px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0}
.opts span{display:block;padding:10px 16px;border:1px solid #444a66;border-radius:22px;color:#8a8fa8;cursor:pointer}
.opts input:checked+span{color:#fff;border-color:#00f0ff;box-shadow:0 0 14px #00f0ff}
.opts input:disabled+span{opacity:.35;cursor:not-allowed}
.opts input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.note{margin:0;color:#8a8fa8;max-width:290px;line-height:1.5}
#nm{width:200px;padding:10px 12px;font:inherit;font-size:16px;text-align:center;color:#fff;background:#0b0d16;border:1px solid #444a66;border-radius:12px;user-select:text;-webkit-user-select:text}
#coins{font-size:18px;color:var(--gold);text-shadow:0 0 12px #ffb300}
#menuBtn{position:absolute;top:0;left:0;z-index:2;padding:6px 12px;font:inherit;color:#8a8fa8;background:#000;border:1px solid #444a66;border-radius:16px;cursor:pointer}
#stats{position:absolute;top:36px;left:0;z-index:2;pointer-events:none;font-size:12px;line-height:1.6;white-space:pre-line;color:#8a8fa8}
.mute{padding:6px 12px;font:inherit;color:#8a8fa8;background:#000;border:1px solid #444a66;border-radius:16px;cursor:pointer}
#muteGame{position:absolute;top:0;right:0;z-index:2}
/* volume slider */
.vol{position:absolute;top:40px;right:8px;z-index:3;width:140px}
.volLabel{position:absolute;top:66px;right:14px;z-index:3;color:#8a8fa8;font-size:12px}
.menuVol{width:200px}
</style>
</head>
<body>
<div class="pad" data-p="0" style="--c:var(--p1)"><span>Player 1: drag or A / D</span><div class="puck"></div></div>
<div id="stage"><canvas id="c"></canvas><button id="menuBtn">Menu</button><div id="stats"></div><button class="mute" id="muteGame">Sound: on</button>
  <input id="volume" class="vol" type="range" min="0" max="200" value="100" aria-label="Volume">
  <div id="volLabel" class="volLabel">100%</div>
</div>
<div class="pad" data-p="1" style="--c:var(--p2)"><span>Player 2: drag or ← / →</span><div class="puck"></div></div>
<div id="menu"><h1>Scope Pong</h1>
<div class="view" id="v1">
<input id="nm" maxlength="14" aria-label="Your name" autocomplete="off">
<div id="coins"></div><button class="link" id="refill" hidden>Get 100 free coins</button>
<button class="big" data-m="2" style="--c:var(--p1)">2 Players</button>
<button class="big" data-m="1" style="--c:var(--p2)">Play with AI</button>
<button class="big" data-m="3" style="--c:var(--gold)">Play Online</button>
<button class="link mute2">Sound: on</button>
<!-- menu volume control -->
<div class="view"><input id="menuVolume" class="menuVol" type="range" min="0" max="200" value="100" aria-label="Menu volume"><div id="menuVolLabel" class="note" style="margin-top:6px">Volume: 100%</div></div>
</div>
<div class="view" id="v2" hidden><p class="note" id="mt"></p>
<div class="opts"><label><input type="radio" name="t" value="60"><span>1 min</span></label><label><input type="radio" name="t" value="120" checked><span>2 min</span></label><label><input type="radio" name="t" value="180"><span>3 min</span></label></div>
<div class="opts"><label><input type="radio" name="d" value="0"><span>Easy</span></label><label><input type="radio" name="d" value="1" checked><span>Medium</span></label><label><input type="radio" name="d" value="2"><span>Hard</span></label></div>
<button class="big" id="go" style="--c:var(--p1)">Start</button><button class="link" id="back">Back</button></div>
<div class="view" id="v3" hidden><p class="note">Pick a stake. Time follows the stake: 10 coins is 1 min, 50 coins is 5 min. Level follows it too: 10–20 coins Easy, 30–40 Medium, 50 Hard. The winner takes the stake.</p>
<div class="opts"><label><input type="radio" name="c" value="10" checked><span>10 coins · 1 min</span></label><label><input type="radio" name="c" value="20"><span>20 coins · 2 min</span></label><label><input type="radio" name="c" value="30"><span>30 coins · 3 min</span></label><label><input type="radio" name="c" value="50"><span>50 coins · 5 min</span></label></div>
<p class="note" id="lv"></p>
<p class="note" id="os"></p>
<button class="big" id="find" style="--c:var(--gold)">Find match</button><button class="link" id="back3">Back</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),menu=$('menu'),v1=$('v1'),v2=$('v2'),v3=$('v3'),mt=$('mt'),dn=$('dn'),os=$('os'),findBtn=$('find'),menuBtn=$('menuBtn'),coinsEl=$('coins'),refill=$('refill'),nm=$('nm');
const volEl=$('volume'),volLabel=$('volLabel'),menuVol=$('menuVolume'),menuVolLabel=$('menuVolLabel');
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
let coins=(()=>{const c=ls.get('sp_coins');return c===null?100:(+c||0)})();
let myName=ls.get('sp_name')||('Guest'+(1000+Math.floor(Math.random()*9000)));
{const p=+ls.get('sp_pend');if(p>0)coins=Math.max(0,coins-p);ls.set('sp_pend',0)}
const saveCoins=()=>ls.set('sp_coins',coins);saveCoins();ls.set('sp_name',myName);nm.value=myName;

// volume: stored as multiplier (0..2)
let volume=(function(){const v=parseFloat(ls.get('sp_vol'));if(isNaN(v))return 1;return Math.max(0,Math.min(2,v))})();

let W,H,R,cx,cy,dpr;var padW=300;
function fit(){dpr=Math.min(2,window.devicePixelRatio||1);padW=document.querySelector('.pad').clientWidth||300;const b=cv.getBoundingClientRect();W=cv.width=Math.max(10,b.width*dpr);H=cv.height=Math.max(10,b.height*dpr);cx=W/2;cy=H/2;R=Math.min(W,H)*.45;}
addEventListener('resize',fit);fit();

const LIM=1.2,HW0=.36,BR=.035;
let HW=HW0,TIME=120,timeLeft=TIME,mode=2,diff=1,RS=1,stake=0,fl=false,role='',oppPeer='',oppName='Opponent',started=false,settled=false,delta=0,joining=false,armed=false;
const P=[{off:0,s:0,c:'#00f0ff',base:-Math.PI/2,dir:1,pulse:0},{off:0,s:0,c:'#ff2bd6',base:Math.PI/2,dir:-1,pulse:0}];
const trail=[];let lastHit=-1;
const ang=i=>P[i].base+P[i].dir*P[i].off;
const clamp=v=>Math.max(-LIM,Math.min(LIM,v));
const me=()=>role==='guest'?0:1;
let ball={x:0,y:0,vx:0,vy:0,sp:.9},state='ready',timer=0,msg='',flash=0,flashW=0,aiErr=0,lastStage=0;

/* ---------- sound ---------- */
let AC=null,mg=null,muted=ls.get('sp_mute')==='1',nextT=0,n8=0;
const CH=[[261.63,329.63,392,523.25],[196,246.94,293.66,392],[220,261.63,329.63,440],[174.61,220,261.63,349.23]];
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=muted?0:volume;mg.connect(AC.destination);setInterval(sched,100)}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,t0,d,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+d+.05);
}
function sfx(k,x){
  if(!AC||muted)return;const t=AC.currentTime;
  if(k==='hit')tone(480+(x||0)*260,t,.1,'square',.07);
  else if(k==='miss'){tone(160,t,.3,'sawtooth',.08);tone(100,t+.04,.35,'sine',.16)}
  else if(k==='win')[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.12,.4,'triangle',.16));
  else if(k==='lose')[392,349,311,262].forEach((f,i)=>tone(f,t+i*.22,.5,'sine',.18));
  else if(k==='draw'){tone(440,t,.3,'triangle',.14);tone(440,t+.28,.4,'triangle',.14)}
}
function sched(){
  if(!AC||muted)return;
  if(!(state==='serve'||state==='play')){nextT=0;return}
  const now=AC.currentTime;if(nextT<now)nextT=now+.05;
  while(nextT<now+.4){
    const c=CH[Math.floor(n8/8)%4],p=[0,1,2,3,2,1,2,3][n8%8];
    tone(c[p],nextT,.28,'triangle',.045);
    if(n8%8===0)tone(c[0]/2,nextT,1.2,'sine',.06);
    nextT+=.3125;n8++;
  }
}
function setMute(m){muted=m;ls.set('sp_mute',m?1:0);if(mg)mg.gain.value=m?0:volume;document.querySelectorAll('#muteGame,.mute2').forEach(b=>{b.textContent='Sound: '+(m?'off':'on')})}
function setVolume(v){volume=Math.max(0,Math.min(2,Number(v)));ls.set('sp_vol',String(volume));if(mg)mg.gain.value=muted?0:volume;const pct=Math.round(volume*100);if(volEl)volEl.value=pct; if(menuVol)menuVol.value=pct; if(volLabel)volLabel.textContent=pct+'%'; if(menuVolLabel)menuVolLabel.textContent='Volume: '+pct+'%'}
addEventListener('pointerdown',audio);addEventListener('keydown',audio);
function endSfx(){const a=P[0].s,b=P[1].s;if(a===b){sfx('draw');return}const w=a>b?0:1;sfx((mode===1?w===1:mode===3?w===me():true)?'win':'lose')}
/* ---------- win stats ---------- */
let stats={};try{stats=JSON.parse(ls.get('sp_stats')||'{}')||{}}catch(e){stats={}}
const statKey=()=>mode===1?'ai':mode===3?'on':'two';
function renderStats(){
  const t=stats[statKey()]||[0,0,0],L=mode===1?['AI Win Point','Your Win Point']:mode===3?['Opponent Win Point','Your Win Point']:['Player 1 Win Point','Player 2 Win Point'];
  $('stats').innerHTML='<span style="color:#00f0ff">'+L[0]+' = '+t[0]+'</span>\n<span style="color:#ff2bd6">'+L[1]+' = '+t[1]+'</span>\nMatch draw = '+t[2];
}
function record(){
  const a=P[0].s,b=P[1].s,k=statKey(),t=stats[k]||(stats[k]=[0,0,0]);
  if(a===b)t[2]++;else{const w=a>b?0:1;t[(mode===3?w===me():w===1)?1:0]++}
  ls.set('sp_stats',JSON.stringify(stats));renderStats();
}

function aiRoll(){const a=[.45,.28,.16][diff];let e=(Math.random()*2-1)*a;if(Math.random()<[.12,.07,.04][diff])e=(Math.random()<.5?-1:1)*(HW+.2);return e}
function serve(to){
  const a=(to===0?-Math.PI/2:Math.PI/2)+(Math.random()-.5);
  ball={x:0,y:0,vx:Math.cos(a),vy:Math.sin(a),sp:.9};state='serve';timer=.9;trail.length=0;lastHit=-1;aiErr=aiRoll();
}
function start(){
  if(!menu.hidden)return;
  if(mode===3){if(state==='over'){leaveGame();showMenu()}return}
  if(state==='ready'||state==='over'){P[0].s=P[1].s=0;msg='';timeLeft=TIME;HW=HW0;RS=1;lastStage=0;P[0].off=P[1].off=0;serve(mode===1?1:(Math.random()<.5?0:1))}
}
function hit(i,d){
  const n=1-BR-.002;ball.x*=n/d;ball.y*=n/d;
  let t=(i===0?Math.PI/2:-Math.PI/2)+(Math.random()-.5)*1.6;
  if(mode===1&&i===0)t=Math.PI/2+(P[1].off>0?1:-1)*(.4+Math.random()*.5);
  const dx=Math.cos(t)-ball.x,dy=Math.sin(t)-ball.y,l=Math.hypot(dx,dy);
  ball.vx=dx/l;ball.vy=dy/l;ball.sp=Math.min(2.3,ball.sp*1.07);P[i].pulse=1;lastHit=i;aiErr=aiRoll();sfx('hit',(ball.sp-.9)/1.4);
}
function miss(i){const w=1-i;P[w].s++;flash=1;flashW=w;sfx('miss');serve(i)}
function endMsg(){const a=P[0].s,b=P[1].s;if(a===b)return 'Draw';const w=a>b?0:1;if(mode===1)return w?'You win':'AI wins';if(mode===3)return w===me()?'You win':'You lose';return 'Player '+(w+1)+' wins'}
function settle(){if(mode!==3||settled)return;settled=true;const a=P[me()].s,b=P[1-me()].s;delta=a>b?stake:a<b?-stake:0;coins=Math.max(0,coins+delta);saveCoins();ls.set('sp_pend',0)}
function finish(){state='over';msg=endMsg();settle();record();endSfx()}
function oppLeft(){if(state==='over')return;P[me()].s=Math.max(P[me()].s,P[1-me()].s+1);state='over';msg='Opponent left. You win';settle();record();sfx('win')}

const held=new Set(),keys=[0,0];
function readKeys(){
  const a=(held.has('d')?1:0)-(held.has('a')?1:0),b=(held.has('arrowright')?1:0)-(held.has('arrowleft')?1:0),s=a+b;
  if(mode===3){keys[0]=role==='guest'?-s:0;keys[1]=role==='guest'?0:s}
  else{keys[0]=mode===1?0:a;keys[1]=mode===1?s:b}
}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(['a','d','arrowleft','arrowright'].includes(k)){held.add(k);readKeys();e.preventDefault()}
  if((k===' '||k==='enter')&&e.target===document.body){start();e.preventDefault()}});
addEventListener('keyup',e=>{held.delete(e.key.toLowerCase());readKeys()});
cv.addEventListener('pointerdown',start);

const pucks=[];
document.querySelectorAll('.pad').forEach(el=>{
  const i=+el.dataset.p;pucks[i]=el.querySelector('.puck');let drag=false,rect=null;
  const set=e=>{if(i===0&&mode!==2)return;const r=rect||(rect=el.getBoundingClientRect());const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));const g=mode===3&&role==='guest';P[g?0:i].off=(f-.5)*LIM*2/2;}
  el.addEventListener('pointerdown',e=>{drag=true;rect=el.getBoundingClientRect();el.setPointerCapture(e.pointerId);set(e);start()});
  el.addEventListener('pointermove',e=>{if(drag)set(e)});
  el.addEventListener('pointerup',()=>{drag=false;rect=null});
  el.addEventListener('pointercancel',()=>drag=false);
});

function guestStep(dt){
  P[0].off=clamp(P[0].off+keys[0]*2.2*dt);flash=Math.max(0,flash-dt*1.5);
  if(state==='play'||state==='serve')timeLeft=Math.max(0,timeLeft-dt);
  if(state==='play'){ball.x+=ball.vx*ball.sp*dt;ball.y+=ball.vy*ball.sp*dt;trail.push([ball.x,ball.y]);if(trail.length>18)trail.shift()}
}
function step(dt){
  if(mode===3&&role==='guest'){guestStep(dt);return}
  for(let i=0;i<2;i++){const p=P[i];p.off=clamp(p.off+keys[i]*2.2*dt);p.pulse=Math.max(0,p.pulse-dt*5)}
  if(mode===3)P[0].off+=(oppT-P[0].off)*Math.min(1,dt*25);
  if(mode===1){let tg=0;if(state==='play'){const b=ball.x*ball.vx+ball.y*ball.vy,c=ball.x*ball.x+ball.y*ball.y-(1-BR)*(1-BR),t=-b+Math.sqrt(Math.max(0,b*b-c)),qx=ball.x+ball.vx*t,qy=ball.y+ball.vy*t;}}
  flash=Math.max(0,flash-dt*1.5);
  if(state==='serve'||state==='play'){
    timeLeft-=dt;if(timeLeft<=0){timeLeft=0;finish();return}
    const st=Math.min(9,Math.floor((1-timeLeft/TIME)*10));if(st!==lastStage){lastStage=st;if(diff>0)P[0].pulse=P[1].pulse=1}
    HW+=(HW0-(diff>0?st*.022:0)-HW)*Math.min(1,dt*4);RS+=((diff===2?1-st*.045:1)-RS)*Math.min(1,dt*4);
  }
  if(state==='serve'){timer-=dt;if(timer<=0)state='play';return}
  if(state!=='play')return;
  ball.x+=ball.vx*ball.sp*dt;ball.y+=ball.vy*ball.sp*dt;trail.push([ball.x,ball.y]);if(trail.length>18)trail.shift();
  const d=Math.hypot(ball.x,ball.y);
  if(d>=1-BR){
    const i=ball.y<0?0:1;
    let df=Math.atan2(ball.y,ball.x)-ang(i);df=Math.atan2(Math.sin(df),Math.cos(df));
    if(Math.abs(df)<=HW+.06)hit(i,d);else miss(i);
  }
}

/* ---------- coins & menu ---------- */
function updLv(){const r=document.querySelector('input[name=c]:checked'),l=$('lv');if(!r){l.textContent='';return}const v=+r.value;l.textContent='Level: '+(v>=50?'Hard':v>=30?'Medium':'Easy');l.style.color=v>=50?"#ff7a7a":v>=30?"#ffd54a":"#8a8fa8"}
document.querySelectorAll('input[name=c]').forEach(r=>r.onchange=updLv);
function refreshCoins(){
  coinsEl.textContent='Coins: '+coins;refill.hidden=coins>=10;
  const rs=[...document.querySelectorAll('input[name=c]')];rs.forEach(r=>{r.disabled=coins<+r.value});
  const ok=rs.filter(r=>!r.disabled);if(!ok.some(r=>r.checked)&&ok[0])ok[0].checked=true;
  findBtn.disabled=!ok.length;updLv();
}
function showMenu(){menu.hidden=false;v1.hidden=false;v2.hidden=true;v3.hidden=true;refreshCoins()}
nm.addEventListener('input',()=>{myName=(nm.value.trim()||'Guest').slice(0,14);ls.set('sp_name',myName)});
refill.onclick=()=>{coins=100;saveCoins();refreshCoins()};
function applyLabels(){const L=document.querySelectorAll('.pad span');
  if(mode===3){L[0].textContent=oppName;L[1].textContent='You: drag or \u2190 / \u2192'}
  else if(mode===1){L[0].textContent='AI';L[1].textContent='You: drag or \u2190 / \u2192'}
  else{L[0].textContent='Player 1: drag or A / D';L[1].textContent='Player 2: drag or \u2190 / \u2192'}}
let pick=2;
const dtxt=['Easy: no shrinking, just play.','Medium: paddles shrink every 10% of the time.','Hard: paddles and circle both shrink every 10%.'];
const upd=()=>{dn.textContent=dtxt[+document.querySelector('input[name=d]:checked').value]};
document.querySelectorAll('input[name=d]').forEach(r=>r.onchange=upd);upd();
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{pick=+b.dataset.m;v1.hidden=true;
  if(pick===3){v3.hidden=false;os.textContent='Both players open this page, pick the same stake and tap Find match.';refreshCoins()}
  else{mt.textContent=pick===1?'Play with AI: choose match time':'2 Players: choose match time';v2.hidden=false}}));
$('back').onclick=()=>{v2.hidden=true;v1.hidden=false};
$('back3').onclick=()=>{leaveGame();v3.hidden=true;v1.hidden=false;refreshCoins()};
$('go').onclick=()=>{mode=pick;diff=+document.querySelector('input[name=d]:checked').value;TIME=+document.querySelector('input[name=t]:checked').value;timeLeft=TIME;fl=false;applyLabels();renderStats();menu.hidden=true};
menuBtn.onclick=()=>{
  if(mode===3&&started&&state!=='over'){
    if(!armed){armed=true;menuBtn.textContent='Tap again to forfeit';setTimeout(()=>{armed=false;if(started)menuBtn.textContent='Forfeit'},3000);return}
    armed=false;coins=Math.max(0,coins-stake);saveCoins();ls.set('sp_pend',0);
  }
  if(mode===3)leaveGame();
  state='ready';held.clear();readKeys();showMenu();
};

/* ---------- online (PeerJS) ---------- */
let peer=null,conn=null,searching=false,lt=0,netT=0,oppT=0,lastO=null,lastS=0;
const hasPeer=()=>typeof Peer!=='undefined';
function send(m){try{if(conn&&conn.open)conn.send(m)}catch(e){}}
function dropPeer(){clearTimeout(lt);if(conn){try{conn.close()}catch(e){}conn=null}if(peer){try{peer.destroy()}catch(e){}peer=null}}
function find(){
  if(!hasPeer()){os.textContent='Online play needs an internet connection.';return}
  const r=document.querySelector('input[name=c]:checked');if(!r||r.disabled){os.textContent='Not enough coins.';return}
  stake=+r.value;findBtn.disabled=true;searching=true;attempt();
}
findBtn.onclick=find;
function attempt(){
  if(!searching)return;
  dropPeer();os.textContent='Looking for an opponent...';
  const id='scopepong-v1-s'+stake,p=new Peer(id);peer=p;
  p.on('open',()=>{role='host';os.textContent='Waiting for an opponent...';
    p.on('connection',c=>{
      if(conn||started){const bye=()=>{c.send({t:'busy'});setTimeout(()=>{try{c.close()}catch(e){}},300)};c.open?bye():c.on('open',bye);return}
      conn=c;wire(c)})});
  p.on('error',e=>{
    if(!searching||peer!==p)return;
    if(e.type==='unavailable-id'){
      p.destroy();const g=new Peer();peer=g;
      g.on('open',()=>{role='guest';os.textContent='Opponent found. Connecting...';const c=g.connect(id,{serialization:'json'});conn=c;wire(c);
        lt=setTimeout(()=>{if(!started)attempt()},7000)});
      g.on('error',()=>{if(searching&&peer===g)lt=setTimeout(attempt,1500)});
    }else if(e.type==='peer-unavailable'){lt=setTimeout(attempt,1500)}
    else{os.textContent='Connection problem ('+e.type+'). Retrying...';lt=setTimeout(attempt,3000)}
  });
}
function wire(c){
  const ready=()=>{if(role==='guest')send({t:'hi',n:myName})};
  c.open?ready():c.on('open',ready);
  c.on('data',m=>{
    if(!m||typeof m!=='object')return;
    if(m.t==='busy'){conn=null;try{c.close()}catch(e){}lt=setTimeout(attempt,3000);return}
    if(m.t==='hi'&&role==='host'&&!started){oppName=String(m.n||'Opponent').slice(0,14);send({t:'go',n:myName});beginOnline();return}
    if(m.t==='go'&&role==='guest'&&!started){oppName=String(m.n||'Opponent').slice(0,14);beginOnline();return}
    if(!started)return;
    if(m.t==='o'&&role==='host'){if(typeof m.off==='number')oppT=clamp(m.off)}
    else if(m.t==='s'&&role==='guest')applyState(m);
  });
  c.on('close',()=>{
    if(c!==conn)return;
    if(started&&state!=='over')oppLeft();
    else if(!started&&searching){conn=null;lt=setTimeout(attempt,1500)}
  });
}
function beginOnline(){
  started=true;searching=false;settled=false;delta=0;mode=3;fl=role==='guest';diff=stake>=50?2:stake>=30?1:0;oppT=0;TIME=stake/10*60;timeLeft=TIME;
  P[0].s=P[1].s=0;P[0].off=P[1].off=0;msg='';HW=HW0;RS=1;lastStage=0;trail.length=0;lastHit=-1;
  applyLabels();renderStats();menu.hidden=true;menuBtn.textContent='Forfeit';ls.set('sp_pend',stake);readKeys();
  if(role==='host'){state='ready';serve(Math.random()<.5?0:1)}else{state='serve';ball={x:0,y:0,vx:0,vy:0,sp:.9}}
}
function applyState(q){
  if(!Array.isArray(q.b)||!Array.isArray(q.s))return;
  const nx=+q.b[0]||0,ny=+q.b[1]||0,er=Math.hypot(nx-ball.x,ny-ball.y),dv=Math.abs((+q.b[2]||0)-ball.vx)+Math.abs((+q.b[3]||0)-ball.vy);
  if(dv>.001||er>.12||state!=='play'){ball.x=nx;ball.y=ny}
  ball.vx=+q.b[2]||0;ball.vy=+q.b[3]||0;ball.sp=+q.b[4]||.9;
  if(q.s[0]!==P[0].s||q.s[1]!==P[1].s){flash=1;flashW=q.s[0]>P[0].s?0:1;sfx('miss')}
  P[0].s=+q.s[0]||0;P[1].s=+q.s[1]||0;P[1].off=+q.o||0;timeLeft=+q.tl||0;HW=+q.hw||HW0;RS=+q.rs||1;
  {const lh=typeof q.lh==='number'?q.lh:-1;if(lh>=0&&lh!==lastHit)sfx('hit',(ball.sp-.9)/1.4);lastHit=lh}
  if(q.st!==state){if(q.st==='over')finish();else if(q.st==='serve'||q.st==='play'){state=q.st;if(q.st==='serve')trail.length=0}}
}
function netTick(dt){
  if(!conn||!started||mode!==3)return;
  netT+=dt;if(netT<.033)return;netT=0;
  const r=v=>Math.round(v*1000)/1000;
  if(role==='host')send({t:'s',o:r(P[1].off),b:[r(ball.x),r(ball.y),r(ball.vx),r(ball.vy),r(ball.sp)],s:[P[0].s,P[1].s],tl:Math.round(timeLeft*10)/10,st:state,hw:r(HW),rs:r(RS),lh:lastHit});
  else{const o=r(P[0].off);if(o!==lastO||(lastS+=dt)>.25){lastO=o;lastS=0;send({t:'o',off:o})}}
}
function leaveGame(){searching=false;dropPeer();started=false;fl=false;state='ready';menuBtn.textContent='Menu';findBtn.disabled=false;os.textContent=''}

/* ---------- drawing ---------- */
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b*dpr}
const lastPx=[null,null];
function setPuck(i,px){px=Math.round(px*2)/2;if(lastPx[i]!==px){lastPx[i]=px;pucks[i].style.transform='translateX('+px+'px)'}}
function draw(){
  const Rb=R;R=Rb*RS;
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,W,H);
  ctx.lineCap='round';
  const ti=fl?1:0,bi=1-ti,sg=fl?-1:1,pi=fl?Math.PI:0,cT=P[0].c,cB=P[1].c;
  const bc=lastHit<0?'#fff':(lastHit===ti?cT:cB);
  ctx.lineWidth=2*dpr;const g=ctx.createLinearGradient(0,cy-R,0,cy+R);g.addColorStop(0,cT);g.addColorStop(1,cB);
  ctx.strokeStyle=g;ctx.globalAlpha=.6;glow('#8a6bff',14);ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.globalAlpha=1;
  if(flash>0){const fc=flashW===ti?cT:cB;ctx.globalAlpha=flash;ctx.strokeStyle=fc;glow(fc,24);ctx.lineWidth=4*dpr;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.globalAlpha=1}
  /* scores and timer sit behind everything else */
  ctx.shadowBlur=0;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=(R*.2)+'px ui-monospace,Menlo,Consolas,monospace';ctx.globalAlpha=.5;
  ctx.fillStyle=cT;ctx.fillText(P[ti].s,cx,cy-R*.5);
  ctx.fillStyle=cB;ctx.fillText(P[bi].s,cx,cy+R*.5);
  const tl=Math.ceil(timeLeft);ctx.font=(R*.07)+'px ui-monospace,Menlo,Consolas,monospace';ctx.globalAlpha=.7;
  ctx.fillStyle=tl<=10&&state!=='ready'?'#ff4d4d':'#8a8fa8';ctx.fillText(Math.floor(tl/60)+':'+String(tl%60).padStart(2,'0'),cx,cy-R*.2);
  ctx.globalAlpha=1;
  for(let k=0;k<2;k++){
    const a=ang(k)+pi,c=k===ti?cT:cB;ctx.strokeStyle=c;glow(c,22+P[k].pulse*16);ctx.lineWidth=(7+P[k].pulse*5)*dpr;
    ctx.beginPath();ctx.arc(cx,cy,R,a-HW,a+HW);ctx.stroke();
  }
  ctx.shadowBlur=0;for(let k=0;k<trail.length;k++){const f=k/trail.length;ctx.globalAlpha=f*.55;ctx.fillStyle=bc;ctx.beginPath();ctx.arc(cx+sg*trail[k][0]*R,cy+sg*trail[k][1]*R,BR*R*f,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.fillStyle='#fff';glow(bc,28);
  ctx.beginPath();ctx.arc(cx+sg*ball.x*R,cy+sg*ball.y*R,BR*R,0,7);ctx.fill();
  ctx.shadowBlur=0;
  if(state==='ready'||state==='over'){
    ctx.fillStyle='#fff';glow('#00f0ff',18);
    ctx.font=(R*.085)+'px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillText(state==='over'?msg:'Tap to start',cx,cy-R*.07);
    ctx.font=(R*.05)+'px ui-monospace,Menlo,Consolas,monospace';
    const cl=delta>0? '+'+delta+' coins':delta<0?delta+' coins':'No coins lost';
    ctx.fillText(state==='over'?(mode===3?cl+'. Tap to continue':'Tap to play again'):'Highest score in '+TIME/60+' min wins',cx,cy+R*.07);
    ctx.shadowBlur=0;
  }
  const mi=(mode===3&&role==='guest')?0:1,sn=mi?1:-1;
  const pw=padW*.44;setPuck(1,sn*P[mi].off/LIM*pw);setPuck(0,sn*P[1-mi].off/LIM*pw);
  R=Rb;
}
let last=performance.now();
(function loop(t){let acc=Math.min(.1,(t-last)/1000);const tot=acc;last=t;while(acc>1e-4){const d=Math.min(.02,acc);step(d);acc-=d}netTick(tot);draw();requestAnimationFrame(loop)})(last);
document.querySelectorAll('#muteGame,.mute2').forEach(b=>b.onclick=()=>{audio();setMute(!muted)});
setMute(muted);renderStats();showMenu();

// initialize volume UI and handlers
if(volEl){volEl.value=Math.round(volume*100);volEl.addEventListener('input',e=>{audio();const v=Number(e.target.value)/100;setVolume(v)});}
if(menuVol){menuVol.value=Math.round(volume*100);menuVol.addEventListener('input',e=>{audio();const v=Number(e.target.value)/100;setVolume(v)});}
// ensure labels show correct percent
if(volLabel)volLabel.textContent=Math.round(volume*100)+'%';
if(menuVolLabel)menuVolLabel.textContent='Volume: '+Math.round(volume*100)+'%';

</script>
